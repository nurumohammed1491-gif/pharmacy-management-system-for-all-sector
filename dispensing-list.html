<!DOCTYPE html>
<html>
<head>
  <title>Medicine Dispensing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Medicine Dispensing</h1>

<form id="dispensingForm">

<label>Patient Name</label>
<input type="text" id="dispensePatient" required>

<label>Medicine Name</label>
<input type="text" id="dispenseMedicine" required>

<label>Quantity</label>
<input type="number" id="dispenseQuantity" required>

<button type="submit">Save Dispensing</button>

</form>

<script src="script.js"></script>

</body>
</html>
